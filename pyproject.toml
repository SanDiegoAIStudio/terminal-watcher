[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-watcher"
version = "0.1.0"
description = "AI-powered terminal activity analyzer and assistant"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lucas Cooper-Bey"}
]
keywords = ["terminal", "ai", "assistant", "claude", "anthropic", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
tw = "terminal_watcher:main"
terminal-watcher = "terminal_watcher:main"

[project.urls]
Homepage = "https://github.com/SanDiegoAIStudio/terminal-watcher"
Repository = "https://github.com/SanDiegoAIStudio/terminal-watcher"
Issues = "https://github.com/SanDiegoAIStudio/terminal-watcher/issues"

[tool.setuptools]
py-modules = ["terminal_watcher"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
